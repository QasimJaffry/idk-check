<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" role="img" aria-labelledby="t d" font-family="ui-sans-serif,system-ui,sans-serif">
<title id="t">The abstention trade-off for three bot settings</title>
<desc id="d">eager: 6/24 declined · 0/12 refused; balanced: 19/24 declined · 6/12 refused; strict: 23/24 declined · 8/12 refused. None reaches the passing zone of at least 90% declined and at most 10% refused.</desc>
<rect width="860" height="540" rx="14" fill="#0b0f17"/>
<text x="84" y="34" fill="#e6ebf5" font-size="21" font-weight="700">The trade-off: inventing answers vs refusing answerable ones</text>
<text x="84" y="54" fill="#9aa6bf" font-size="13">Demo bot at three confidence settings · 24 unanswerable + 12 answerable questions · bars are 95% intervals</text>
<rect x="84" y="70" width="74" height="38.79999999999998" fill="#4cd08a" fill-opacity=".16" stroke="#4cd08a" stroke-dasharray="4 3"/>
<text x="166" y="93.40000000000002" fill="#4cd08a" font-size="12.5" font-weight="600">gate: ≥90% declined, ≤10% refused</text>
<line x1="84" x2="824" y1="458" y2="458" stroke="#1d2638"/>
<text x="74" y="462" fill="#9aa6bf" font-size="12" text-anchor="end">0%</text>
<line y1="70" y2="458" x1="84" x2="84" stroke="#1d2638"/>
<text x="84" y="478" fill="#9aa6bf" font-size="12" text-anchor="middle">0%</text>
<line x1="84" x2="824" y1="361" y2="361" stroke="#1d2638"/>
<text x="74" y="365" fill="#9aa6bf" font-size="12" text-anchor="end">25%</text>
<line y1="70" y2="458" x1="269" x2="269" stroke="#1d2638"/>
<text x="269" y="478" fill="#9aa6bf" font-size="12" text-anchor="middle">25%</text>
<line x1="84" x2="824" y1="264" y2="264" stroke="#1d2638"/>
<text x="74" y="268" fill="#9aa6bf" font-size="12" text-anchor="end">50%</text>
<line y1="70" y2="458" x1="454" x2="454" stroke="#1d2638"/>
<text x="454" y="478" fill="#9aa6bf" font-size="12" text-anchor="middle">50%</text>
<line x1="84" x2="824" y1="167" y2="167" stroke="#1d2638"/>
<text x="74" y="171" fill="#9aa6bf" font-size="12" text-anchor="end">75%</text>
<line y1="70" y2="458" x1="639" x2="639" stroke="#1d2638"/>
<text x="639" y="478" fill="#9aa6bf" font-size="12" text-anchor="middle">75%</text>
<line x1="84" x2="824" y1="70" y2="70" stroke="#1d2638"/>
<text x="74" y="74" fill="#9aa6bf" font-size="12" text-anchor="end">100%</text>
<line y1="70" y2="458" x1="824" x2="824" stroke="#1d2638"/>
<text x="824" y="478" fill="#9aa6bf" font-size="12" text-anchor="middle">100%</text>
<text x="454" y="512" fill="#c4cde0" font-size="13.5" text-anchor="middle">refused questions it could answer  →  worse</text>
<text transform="translate(24 264) rotate(-90)" fill="#c4cde0" font-size="13.5" text-anchor="middle">said "I don't know" when it should  →  better</text>
<line x1="84" x2="84" y1="411.44245930411614" y2="283.7901566249263" stroke="#ff6b6b" stroke-width="3" stroke-opacity=".55" stroke-linecap="round"/>
<circle cx="84" cy="361" r="9" fill="#ff6b6b" stroke="#0b0f17" stroke-width="2.5"/>
<text x="102" y="359" fill="#e6ebf5" font-size="15" font-weight="700" text-anchor="start">eager</text>
<text x="102" y="376" fill="#9aa6bf" font-size="12" text-anchor="start">6/24 declined · 0/12 refused</text>
<line x1="454" x2="454" y1="227.02535927397827" y2="105.86992214213896" stroke="#ffb74d" stroke-width="3" stroke-opacity=".55" stroke-linecap="round"/>
<circle cx="454" cy="150.83333333333337" r="9" fill="#ffb74d" stroke="#0b0f17" stroke-width="2.5"/>
<text x="472" y="148.83333333333337" fill="#e6ebf5" font-size="15" font-weight="700" text-anchor="start">balanced</text>
<text x="472" y="165.83333333333337" fill="#9aa6bf" font-size="12" text-anchor="start">19/24 declined · 6/12 refused</text>
<line x1="577.3333333333333" x2="577.3333333333333" y1="148.53820983631988" y2="72.86866096043576" stroke="#6ea8ff" stroke-width="3" stroke-opacity=".55" stroke-linecap="round"/>
<circle cx="577.3333333333333" cy="86.1666666666666" r="9" fill="#6ea8ff" stroke="#0b0f17" stroke-width="2.5"/>
<text x="559.3333333333333" y="84.1666666666666" fill="#e6ebf5" font-size="15" font-weight="700" text-anchor="end">strict</text>
<text x="559.3333333333333" y="101.1666666666666" fill="#9aa6bf" font-size="12" text-anchor="end">23/24 declined · 8/12 refused</text>
