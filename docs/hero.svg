<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">idk-check: does your AI say I don't know when it should?</title><desc id="d">A test for RAG apps. For the question about the Care Plus excess, which the docs do not state, an eager bot invents an answer and a strict bot correctly says I don't know. For the City bike price, which the docs do state, the strict bot wrongly refuses. idk-check scores both mistakes.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd978"/><stop offset="1" stop-color="#ff9a76"/></linearGradient></defs>
<rect width="1200" height="440" rx="24" fill="#0a0d14"/><rect x=".5" y=".5" width="1199" height="439" rx="23.5" fill="none" stroke="#1c2433"/>
<text x="56" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" letter-spacing="2" fill="#7f8aa3">RAG APP TESTING · CI READY</text>
<text x="56" y="170" font-size="76" font-weight="800" letter-spacing="-2" fill="#f4f6fb">idk-check</text>
<text x="56" y="226" font-size="32" font-weight="700" fill="url(#g)">Does your AI say “I don’t know”</text>
<text x="56" y="264" font-size="32" font-weight="700" fill="url(#g)">when it should?</text>
<text x="56" y="316" font-size="22" fill="#a9b3c9">Asks questions your docs can and</text>
<text x="56" y="346" font-size="22" fill="#a9b3c9">can’t answer, then scores both: made-up</text>
<text x="56" y="376" font-size="22" fill="#a9b3c9">answers and needless refusals.</text>
<text x="56" y="416" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#5d6881">TypeScript · zero dependencies · MIT</text>
<rect x="580" y="44" width="564" height="356" rx="18" fill="#0f1420" stroke="#1f2a3d"/>
<rect x="604" y="66" width="168" height="28" rx="14" fill="#ffc857" fill-opacity=".16" stroke="#ffc857" stroke-opacity=".6"/><text x="688.0" y="86" font-size="18" font-weight="600" text-anchor="middle" fill="#ffc857">docs don’t say</text>
<text x="604" y="130" font-size="22" font-weight="600" fill="#f4f6fb">Excess on the Care Plus theft insurance?</text>
<rect x="604" y="142" width="516" height="38" rx="10" fill="#ff6b6b" fill-opacity=".12" stroke="#ff6b6b" stroke-opacity=".45"/><text x="620" y="167" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#ff6b6b">eager</text><text x="700" y="167" font-size="19" fill="#e3e8f4">Care Plus costs £15 per month and…</text><text x="1104" y="168" font-size="22" font-weight="800" text-anchor="end" fill="#ff6b6b">✗</text>
<rect x="604" y="188" width="516" height="38" rx="10" fill="#4cd08a" fill-opacity=".12" stroke="#4cd08a" stroke-opacity=".45"/><text x="620" y="213" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#4cd08a">strict</text><text x="700" y="213" font-size="19" fill="#e3e8f4">I don’t know. The docs don’t cover that.</text><text x="1104" y="214" font-size="22" font-weight="800" text-anchor="end" fill="#4cd08a">✓</text>
<rect x="604" y="244" width="148" height="28" rx="14" fill="#7fb2ff" fill-opacity=".16" stroke="#7fb2ff" stroke-opacity=".6"/><text x="678.0" y="264" font-size="18" font-weight="600" text-anchor="middle" fill="#7fb2ff">docs do say</text>
<text x="768" y="265" font-size="21" font-weight="600" fill="#f4f6fb">How much does the City bike cost?</text>
<rect x="604" y="282" width="516" height="38" rx="10" fill="#ff6b6b" fill-opacity=".12" stroke="#ff6b6b" stroke-opacity=".45"/><text x="620" y="307" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#ff6b6b">strict</text><text x="700" y="307" font-size="19" fill="#e3e8f4">I don’t know. The docs don’t cover that.</text><text x="1104" y="308" font-size="22" font-weight="800" text-anchor="end" fill="#ff6b6b">✗</text>
<rect x="604" y="340" width="516" height="44" rx="11" fill="#ffc857" fill-opacity=".14" stroke="#ffc857" stroke-opacity=".55"/>
<text x="624" y="369" font-size="20" font-weight="700" fill="#ffc857">Too eager or too strict? Measure both.</text>
