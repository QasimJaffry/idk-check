name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [20, 22] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo
      - run: npm run site
      # dogfood: the gate itself, run against the demo bot over HTTP
      - run: |
          node examples/bots/server.mjs balanced &
          sleep 1
          node dist/cli.js run --suite examples/suite.json --url http://localhost:3311/api/ask \
            --answer-path answer --min-abstain 0.75 --max-false-refusal 0.6 --quiet
